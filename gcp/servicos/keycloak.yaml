# Cloud Run: Keycloak (1 instância, cache local). Variáveis ${...} preenchidas pelo deploy.sh.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: praia-keycloak
  labels:
    cloud.googleapis.com/location: ${REGIAO}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # mínimo controlado pelo despertador (deploy.sh preserva o valor atual)
        autoscaling.knative.dev/minScale: '${MIN_KEYCLOAK}'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/network-interfaces: '[{"network":"${REDE}","subnetwork":"${SUBREDE}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: praia-keycloak@${PROJETO}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: keycloak
          image: ${IMAGEM_KEYCLOAK}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://${IP_SQL}:5432/keycloak?sslmode=require
            - name: KC_DB_USERNAME
              value: keycloak
            # poucas conexões bastam para o login da equipe; o padrão (100) estouraria o banco pequeno
            # (db-f1-micro aceita ~25, db-g1-small ~50, e a API também usa o mesmo banco)
            - name: KC_DB_POOL_MAX_SIZE
              value: '10'
            - name: KC_HOSTNAME
              value: ${URL_KEYCLOAK}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: bootstrap-admin
            - name: PRAIA_URL_PUBLICA
              value: ${URL_PUBLICA}
            - name: PRAIA_ADMIN_EMAIL
              value: ${ADMIN_EMAIL}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-keycloak-password, key: latest }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-bootstrap-password, key: latest }
            - name: PRAIA_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: keycloak-api-client-secret, key: latest }
            - name: PRAIA_ADMIN_SENHA_INICIAL
              valueFrom:
                secretKeyRef: { name: praia-admin-senha-inicial, key: latest }
          resources:
            limits:
              cpu: '1'
              memory: 1536Mi
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
